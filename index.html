<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rotex Forex Calculator (Market Standard)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  padding:20px
}
.container{
  display:flex;
  flex-wrap:wrap;
  gap:25px;
  justify-content:center
}
.box{
  width:380px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.2);
  border-radius:12px;
  padding:15px
}
h2{
  margin-bottom:10px;
  background:linear-gradient(90deg,#5A378A,#EE7448);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent
}
label{font-size:13px;margin-top:8px;display:block}
input,select{
  width:100%;
  padding:8px;
  margin-top:5px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.3);
  border-radius:6px;
  color:#fff
}
.result{
  margin-top:12px;
  background:rgba(255,255,255,.1);
  padding:8px;
  border-radius:6px
}
</style>
</head>

<body>

<h1 style="text-align:center">ROTEX FOREX CALCULATOR</h1>

<div class="container">

<!-- PIP VALUE & SPREAD -->
<div class="box">
<h2>Pip Value & Spread</h2>

<label>Pair</label>
<input id="pvPair" value="EURUSD">

<label>Lots</label>
<input id="pvLots" type="number" value="1">

<label>Price</label>
<input id="pvPrice" type="number" step="0.00001">

<label>Spread (pips)</label>
<input id="pvSpread" type="number" step="0.1">

<div class="result" id="pipValueResult">-</div>
<div class="result" id="spreadCostResult">-</div>
</div>

<!-- PROFIT / LOSS -->
<div class="box">
<h2>Profit / Loss</h2>

<label>Pair</label>
<input id="plPair" value="EURUSD">

<label>Lots</label>
<input id="plLots" type="number" value="1">

<label>Open Price</label>
<input id="plOpen" type="number" step="0.00001">

<label>Close Price</label>
<input id="plClose" type="number" step="0.00001">

<label>Type</label>
<select id="plType">
<option value="buy">Buy</option>
<option value="sell">Sell</option>
</select>

<div class="result" id="plResult">-</div>
</div>

<!-- MARGIN -->
<div class="box">
<h2>Margin Calculator</h2>

<label>Pair</label>
<input id="mPair" value="EURUSD">

<label>Lots</label>
<input id="mLots" type="number" value="1">

<label>Price</label>
<input id="mPrice" type="number" step="0.00001">

<label>Leverage (1:100 → 100)</label>
<input id="mLeverage" type="number" value="100">

<label>Equity (USD)</label>
<input id="mEquity" type="number" value="1000">

<div class="result" id="marginResult">-</div>
<div class="result" id="marginLevelResult">-</div>
</div>

</div>

<script>
const CONTRACT = 100000;

// mock conversion rates → replace with live API later
const FX = {
  EURUSD: 1.08,
  USDJPY: 150,
  GBPUSD: 1.26,
  AUDUSD: 0.66,
  USDCAD: 1.35
};

function pipSize(pair){
  return pair.endsWith("JPY") ? 0.01 : 0.0001;
}

function convertToUSD(currency){
  if(currency==="USD") return 1;
  const pair = currency+"USD";
  const inv = "USD"+currency;
  if(FX[pair]) return FX[pair];
  if(FX[inv]) return 1/FX[inv];
  return 1;
}

/* PIP VALUE */
function calcPip(){
  const pair=pvPair.value.toUpperCase();
  const base=pair.slice(0,3), quote=pair.slice(3);
  const lots=+pvLots.value;
  const spread=+pvSpread.value||0;

  const pip=pipSize(pair);
  let pipValueQuote = pip * CONTRACT * lots;
  let pipUSD = pipValueQuote * convertToUSD(quote);

  pipValueResult.innerText = `Pip Value: $${pipUSD.toFixed(2)}`;
  spreadCostResult.innerText = `Spread Cost: $${(pipUSD*spread).toFixed(2)}`;
}

/* PROFIT / LOSS */
function calcPL(){
  const pair=plPair.value.toUpperCase();
  const base=pair.slice(0,3), quote=pair.slice(3);
  const open=+plOpen.value, close=+plClose.value;
  const lots=+plLots.value;
  if(!open||!close) return;

  let points=(close-open);
  if(plType.value==="sell") points*=-1;

  let profitQuote = points * CONTRACT * lots;
  let profitUSD = profitQuote * convertToUSD(quote);

  plResult.innerText=`P/L: $${profitUSD.toFixed(2)}`;
}

/* MARGIN */
function calcMargin(){
  const pair=mPair.value.toUpperCase();
  const base=pair.slice(0,3);
  const price=+mPrice.value;
  const lots=+mLots.value;
  const lev=+mLeverage.value;
  const equity=+mEquity.value;
  if(!price||!lev) return;

  let marginBase = CONTRACT * lots;
  let marginUSD = (base==="USD")
    ? marginBase/lev
    : (marginBase*price*convertToUSD(base))/lev;

  marginResult.innerText=`Margin Used: $${marginUSD.toFixed(2)}`;
  marginLevelResult.innerText=
    `Margin Level: ${((equity/marginUSD)*100).toFixed(2)}%`;
}

document.querySelectorAll("input,select")
.forEach(e=>e.addEventListener("input",()=>{
  calcPip();
  calcPL();
  calcMargin();
}));
</script>

</body>
</html>
