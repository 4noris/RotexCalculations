<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rotex Full Trading Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:16px;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
h1{
  text-align:center;
  margin-bottom:16px;
  font-size:26px;
  background:linear-gradient(90deg,#5A378A,#EE7448);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.dashboard{
  max-width:600px;
  margin:0 auto;
}
.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
}
.card h3{
  margin:0 0 10px;
  font-size:18px;
}
label{
  display:block;
  margin-top:10px;
  font-size:13px;
  opacity:.85;
}
input,select{
  width:100%;
  margin-top:6px;
  padding:9px;
  background:#111;
  color:#fff;
  border:1px solid rgba(255,255,255,0.3);
  border-radius:6px;
  font-size:14px;
}
.result{
  margin-top:12px;
  padding:10px;
  background:#111;
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.3);
  font-weight:600;
  font-size:14px;
  line-height:1.6;
}
.small{
  font-size:12px;
  color:#aaa;
  margin-top:6px;
}
</style>
</head>

<body>

<h1>ROTEX FULL TRADING CALCULATOR</h1>

<div class="dashboard">

<!-- TRADE INPUT -->
<div class="card">
<h3>Trade Setup</h3>

<label>Symbol</label>
<input id="symbol" value="EURUSD">

<label>Instrument Type</label>
<select id="instrument">
  <option value="forex">Forex</option>
  <option value="crypto">Crypto</option>
</select>

<label>Lot Size</label>
<input id="lots" type="number" step="0.01" value="1">

<label>Contract Size</label>
<input id="contract" type="number" value="100000">

<label>Open Price</label>
<input id="open" type="number" step="0.00001">

<label>Close / Market Price</label>
<input id="close" type="number" step="0.00001">

<label>Digits (price precision)</label>
<select id="digits">
  <option value="5">5 (EURUSD)</option>
  <option value="3">3 (JPY pairs)</option>
  <option value="2">2 (Crypto / Metals)</option>
</select>

</div>

<!-- COSTS -->
<div class="card">
<h3>Costs</h3>

<label>Commission</label>
<input id="commission" type="number" step="0.01" value="0">

<label>Swap Rate (per day)</label>
<input id="swap" type="number" step="0.0001" value="0">

<label>Days Held</label>
<input id="days" type="number" value="1">

</div>

<!-- MARGIN -->
<div class="card">
<h3>Margin</h3>

<label>Leverage (e.g. 100 = 1:100)</label>
<input id="leverage" type="number" value="100">

<label>Account Equity (USD)</label>
<input id="equity" type="number" value="1000">

</div>

<!-- RESULTS -->
<div class="card">
<h3>Results</h3>
<div class="result" id="output">Enter values to calculate</div>
</div>

</div>

<script>
/* ================================
   CORE UTILITIES
================================ */

function smallestMovement(digits){
  return Math.pow(10,-digits);
}

function isCrypto(){
  return instrument.value === "crypto";
}

/* ================================
   MAIN CALCULATION
================================ */
function calculate(){
  const lots = parseFloat(lotsInput.value);
  const contractSize = parseFloat(contract.value);
  const open = parseFloat(openInput.value);
  const close = parseFloat(closeInput.value);
  const digits = parseInt(digitsInput.value);
  const commissionRate = parseFloat(commission.value);
  const swapRate = parseFloat(swap.value);
  const days = parseInt(days.value);
  const leverage = parseFloat(leverageInput.value);
  const equity = parseFloat(equityInput.value);

  if(isNaN(open) || isNaN(close)) return;

  const point = smallestMovement(digits);

  /* Notional */
  const notional = close * contractSize * lots;

  /* Gross P/L */
  const grossPL = (close - open) * contractSize * lots;

  /* Commission */
  let commissionCost = 0;
  if(commissionRate > 0){
    commissionCost = isCrypto()
      ? close * contractSize * lots * (commissionRate / 100)
      : close * contractSize * lots * commissionRate;
  }

  /* Swap */
  const swapCost = point * contractSize * lots * swapRate * days;

  /* Margin */
  const margin = notional / leverage;
  const marginLevel = equity > 0 ? (equity / margin) * 100 : 0;

  /* Net */
  const netPL = grossPL - commissionCost - swapCost;

  output.innerHTML =
    "Notional Value: $" + notional.toFixed(2) + "<br>" +
    "Margin Required: $" + margin.toFixed(2) + "<br>" +
    "Margin Level: " + marginLevel.toFixed(2) + "%<br><br>" +
    "Gross P/L: $" + grossPL.toFixed(2) + "<br>" +
    "Commission: $" + commissionCost.toFixed(2) + "<br>" +
    "Swap: $" + swapCost.toFixed(2) + "<br>" +
    "————————————<br>" +
    "NET RESULT: $" + netPL.toFixed(2);
}

/* ================================
   LIVE UPDATE
================================ */
const lotsInput = document.getElementById("lots");
const contract = document.getElementById("contract");
const openInput = document.getElementById("open");
const closeInput = document.getElementById("close");
const digitsInput = document.getElementById("digits");
const commission = document.getElementById("commission");
const swap = document.getElementById("swap");
const days = document.getElementById("days");
const leverageInput = document.getElementById("leverage");
const equityInput = document.getElementById("equity");
const instrument = document.getElementById("instrument");
const output = document.getElementById("output");

document.querySelectorAll("input,select").forEach(el=>{
  el.addEventListener("input", calculate);
});
</script>

</body>
</html>
