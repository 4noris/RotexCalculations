<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rotex Formula Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:16px;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
h1{
  text-align:center;
  margin-bottom:20px;
  background:linear-gradient(90deg,#5A378A,#EE7448);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.box{
  max-width:560px;
  margin:14px auto;
  padding:14px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:14px;
}
.box h3{
  margin:0 0 10px;
}
input,select,button{
  width:100%;
  margin-top:6px;
  padding:8px;
  background:#111;
  color:#fff;
  border:1px solid rgba(255,255,255,0.3);
  border-radius:6px;
}
button{
  margin-top:10px;
  cursor:pointer;
  font-weight:600;
}
.result{
  margin-top:10px;
  padding:10px;
  background:#111;
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.3);
  font-weight:600;
}
.note{
  font-size:13px;
  color:#aaa;
}
</style>
</head>

<body>

<h1>ROTEX FORMULA CALCULATOR</h1>

<!-- LEVERAGE -->
<div class="box">
<h3>Leverage</h3>
<input id="lev_price" placeholder="Current Market Price">
<input id="lev_lot" placeholder="Lot Size">
<input id="lev_contract" placeholder="Contract Size">
<input id="lev_margin" placeholder="Blocked Margin">
<button onclick="calcLeverage()">Calculate</button>
<div class="result" id="lev_result">-</div>
</div>

<!-- POINT VALUE PER LOT -->
<div class="box">
<h3>Point Value per Lot</h3>
<input id="pvl_move" placeholder="Smallest Movement">
<input id="pvl_contract" placeholder="Contract Size">
<input id="pvl_conv" placeholder="Conversion Rate">
<button onclick="calcPVLot()">Calculate</button>
<div class="result" id="pvl_result">-</div>
</div>

<!-- COMMISSION PER MILLION -->
<div class="box">
<h3>Commission per Million</h3>
<input id="cpm_notional" placeholder="Notional Value">
<input id="cpm_amount" placeholder="Amount per Million">
<button onclick="calcCPM()">Calculate</button>
<div class="result" id="cpm_result">-</div>
</div>

<!-- NOTIONAL VALUE -->
<div class="box">
<h3>Notional Value (USD)</h3>
<input id="nv_price" placeholder="Price">
<input id="nv_lot" placeholder="Lot Size">
<input id="nv_contract" placeholder="Contract Size">
<input id="nv_conv" placeholder="Conversion Rate">
<button onclick="calcNotional()">Calculate</button>
<div class="result" id="nv_result">-</div>
</div>

<!-- POINT VALUE -->
<div class="box">
<h3>Point Value</h3>
<input id="pv_move" placeholder="Smallest Movement">
<input id="pv_lot" placeholder="Lot Size">
<input id="pv_contract" placeholder="Contract Size">
<input id="pv_conv" placeholder="Conversion Rate">
<button onclick="calcPV()">Calculate</button>
<div class="result" id="pv_result">-</div>
</div>

<!-- COMMISSION -->
<div class="box">
<h3>Commission</h3>
<input id="com_price" placeholder="Close Price">
<input id="com_contract" placeholder="Contract Size">
<input id="com_lot" placeholder="Lot Size">
<input id="com_rate" placeholder="Commission Rate">
<select id="com_type">
  <option value="forex">Forex</option>
  <option value="crypto">Crypto</option>
</select>
<button onclick="calcCommission()">Calculate</button>
<div class="result" id="com_result">-</div>
</div>

<!-- NOTE -->
<div class="box note">
<strong>Important Note</strong><br>
• Multiply if USD is Quote (e.g. NZDUSD)<br>
• Divide if USD is Base (e.g. USDJPY)
</div>

<script>
function calcLeverage(){
  lev_result.innerText =
    (Number(lev_price.value) *
     Number(lev_lot.value) *
     Number(lev_contract.value) /
     Number(lev_margin.value)).toFixed(2);
}

function calcPVLot(){
  pvl_result.innerText =
    (Number(pvl_move.value) *
     Number(pvl_contract.value) *
     Number(pvl_conv.value)).toFixed(5);
}

function calcCPM(){
  cpm_result.innerText =
    (Number(cpm_notional.value) *
     (Number(cpm_amount.value) / 1000000)).toFixed(2);
}

function calcNotional(){
  nv_result.innerText =
    (Number(nv_price.value) *
     Number(nv_lot.value) *
     Number(nv_contract.value) *
     Number(nv_conv.value)).toFixed(2);
}

function calcPV(){
  pv_result.innerText =
    (Number(pv_move.value) *
     Number(pv_lot.value) *
     Number(pv_contract.value) *
     Number(pv_conv.value)).toFixed(5);
}

function calcCommission(){
  let rate = Number(com_rate.value);
  if(com_type.value === "crypto") rate /= 100;

  com_result.innerText =
    (Number(com_price.value) *
     Number(com_contract.value) *
     Number(com_lot.value) *
     rate).toFixed(2);
}
</script>

</body>
</html>
