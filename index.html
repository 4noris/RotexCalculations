<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rotex Formula Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:16px;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
h1{
  text-align:center;
  margin-bottom:18px;
  background:linear-gradient(90deg,#5A378A,#EE7448);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.box{
  max-width:560px;
  margin:14px auto;
  padding:14px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:14px;
}
.box h3{
  margin:0 0 8px;
}
label{
  display:block;
  margin-top:8px;
  font-size:13px;
  opacity:.85;
}
input,select,button{
  width:100%;
  margin-top:5px;
  padding:8px;
  background:#111;
  color:#fff;
  border:1px solid rgba(255,255,255,0.3);
  border-radius:6px;
}
button{
  margin-top:10px;
  cursor:pointer;
  background:#1c1c1c;
  font-weight:600;
}
.result{
  margin-top:10px;
  padding:10px;
  background:#111;
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.3);
  font-weight:600;
}
.small{
  font-size:12px;
  color:#aaa;
  margin-top:6px;
}
</style>
</head>

<body>

<h1>ROTEX FORMULA CALCULATOR</h1>

<!-- NOTIONAL VALUE -->
<div class="box">
<h3>Notional Value (USD)</h3>
<label>Price</label><input id="nv_price">
<label>Lot Size</label><input id="nv_lots" value="1">
<label>Contract Size</label><input id="nv_contract" value="100000">
<label>Conversion Rate</label><input id="nv_conv" value="1">
<button onclick="calcNotional()">Calculate</button>
<div class="result" id="nv_res">-</div>
</div>

<!-- LEVERAGE -->
<div class="box">
<h3>Leverage</h3>
<label>Market Price</label><input id="lev_price">
<label>Lot Size</label><input id="lev_lots" value="1">
<label>Contract Size</label><input id="lev_contract" value="100000">
<label>Blocked Margin</label><input id="lev_margin">
<button onclick="calcLeverage()">Calculate</button>
<div class="result" id="lev_res">-</div>
</div>

<!-- POINT VALUE PER LOT -->
<div class="box">
<h3>Point Value per Lot</h3>
<label>Digits</label><input id="pvl_digits" value="5">
<label>Contract Size</label><input id="pvl_contract" value="100000">
<label>Conversion Rate</label><input id="pvl_conv" value="1">
<button onclick="calcPVLot()">Calculate</button>
<div class="result" id="pvl_res">-</div>
</div>

<!-- POINT VALUE -->
<div class="box">
<h3>Point Value</h3>
<label>Digits</label><input id="pv_digits" value="5">
<label>Lot Size</label><input id="pv_lots" value="1">
<label>Contract Size</label><input id="pv_contract" value="100000">
<label>Conversion Rate</label><input id="pv_conv" value="1">
<button onclick="calcPV()">Calculate</button>
<div class="result" id="pv_res">-</div>
</div>

<!-- COMMISSION PER MILLION -->
<div class="box">
<h3>Commission per Million</h3>
<label>Notional Value (USD)</label><input id="cpm_notional">
<label>Amount per Million</label><input id="cpm_amt">
<button onclick="calcCPM()">Calculate</button>
<div class="result" id="cpm_res">-</div>
</div>

<!-- SWAP -->
<div class="box">
<h3>Swap</h3>
<label>Digits</label><input id="sw_digits" value="5">
<label>Contract Size</label><input id="sw_contract" value="100000">
<label>Lot Size</label><input id="sw_lots" value="1">
<label>Swap Rate</label><input id="sw_rate">
<label>Days</label><input id="sw_days" value="1">
<button onclick="calcSwap()">Calculate</button>
<div class="result" id="sw_res">-</div>
</div>

<!-- COMMISSION -->
<div class="box">
<h3>Commission</h3>
<label>Close Price</label><input id="com_price">
<label>Contract Size</label><input id="com_contract" value="1">
<label>Lot Size</label><input id="com_lots" value="1">
<label>Commission Rate (Forex = decimal | Crypto = %)</label><input id="com_rate">
<label>Instrument</label>
<select id="com_type">
  <option value="forex">Forex</option>
  <option value="crypto">Crypto</option>
</select>
<button onclick="calcCommission()">Calculate</button>
<div class="result" id="com_res">-</div>
</div>

<div class="box small">
Important Note:<br>
• Multiply if USD is Quote (e.g. NZDUSD)<br>
• Divide if USD is Base (e.g. USDJPY)
</div>

<script>
function point(d){
  return Math.pow(10, -Number(d));
}

/* NOTIONAL VALUE */
function calcNotional(){
  const price = Number(nv_price.value);
  const lots = Number(nv_lots.value);
  const contract = Number(nv_contract.value);
  const conv = Number(nv_conv.value);

  nv_res.innerText = (price * lots * contract * conv).toFixed(2);
}

/* LEVERAGE */
function calcLeverage(){
  const price = Number(lev_price.value);
  const lots = Number(lev_lots.value);
  const contract = Number(lev_contract.value);
  const margin = Number(lev_margin.value);

  lev_res.innerText = (price * lots * contract / margin).toFixed(2);
}

/* POINT VALUE PER LOT */
function calcPVLot(){
  const digits = Number(pvl_digits.value);
  const contract = Number(pvl_contract.value);
  const conv = Number(pvl_conv.value);

  pvl_res.innerText = (point(digits) * contract * conv).toFixed(5);
}

/* POINT VALUE */
function calcPV(){
  const digits = Number(pv_digits.value);
  const lots = Number(pv_lots.value);
  const contract = Number(pv_contract.value);
  const conv = Number(pv_conv.value);

  pv_res.innerText = (point(digits) * lots * contract * conv).toFixed(5);
}

/* COMMISSION PER MILLION */
function calcCPM(){
  const notional = Number(cpm_notional.value);
  const amt = Number(cpm_amt.value);

  cpm_res.innerText = (notional * (amt / 1_000_000)).toFixed(2);
}

/* SWAP */
function calcSwap(){
  const digits = Number(sw_digits.value);
  const contract = Number(sw_contract.value);
  const lots = Number(sw_lots.value);
  const rate = Number(sw_rate.value);
  const days = Number(sw_days.value);

  sw_res.innerText =
    (point(digits) * contract * lots * rate * days).toFixed(5);
}

/* COMMISSION */
function calcCommission(){
  const price = Number(com_price.value);
  const contract = Number(com_contract.value);
  const lots = Number(com_lots.value);
  let rate = Number(com_rate.value);

  if(com_type.value === "crypto") rate /= 100;

  com_res.innerText = (price * contract * lots * rate).toFixed(2);
}
</script>

</body>
</html>
