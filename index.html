<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rotex Trade Summary Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  background:#000;
  color:#fff;
  font-family:Arial, Helvetica, sans-serif;
}
h1{
  text-align:center;
  font-size:28px;
  margin-bottom:20px;
  background:linear-gradient(90deg,#5A378A,#EE7448);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.container{
  max-width:520px;
  margin:0 auto;
  padding:20px;
  border-radius:14px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.2);
}
label{
  display:block;
  margin-top:12px;
  font-size:13px;
  opacity:.85;
}
input{
  width:100%;
  margin-top:6px;
  padding:9px;
  background:#111;
  color:#fff;
  border:1px solid rgba(255,255,255,0.3);
  border-radius:6px;
  font-size:14px;
}
.result{
  margin-top:16px;
  padding:12px;
  border-radius:10px;
  background:#111;
  border:1px solid rgba(255,255,255,0.3);
  font-weight:600;
  font-size:14px;
  line-height:1.6;
}
.small{
  margin-top:8px;
  font-size:12px;
  color:#aaa;
  text-align:center;
}
</style>
</head>

<body>

<h1>ROTEX TRADE SUMMARY</h1>

<div class="container">

  <label>Symbol (e.g. EURUSD, BTCUSD)</label>
  <input id="symbol" value="EURUSD">

  <label>Lots</label>
  <input id="lots" type="number" step="0.01" value="1">

  <label>Open Price</label>
  <input id="open" type="number" step="0.00001">

  <label>Close Price</label>
  <input id="close" type="number" step="0.00001">

  <label>Commission Rate</label>
  <input id="commission" type="number" step="0.01" value="0">

  <label>Swap Rate (per day)</label>
  <input id="swap" type="number" step="0.0001" value="0">

  <label>Days Held</label>
  <input id="days" type="number" value="1">

  <div class="result" id="output">
    Enter values to see trade summary
  </div>

  <div class="small">
    Forex: commission as decimal (e.g. 0.0002)<br>
    Crypto: commission as % (e.g. 0.1)
  </div>

</div>

<script>
/* ================================
   CORE LOGIC
================================ */

function isCrypto(symbol){
  symbol = symbol.toUpperCase();
  return symbol.includes("BTC") || symbol.includes("ETH");
}

function contractSize(){
  return 100000; // standard lot
}

function update(){
  const symbol = document.getElementById("symbol").value.toUpperCase();
  const lots = parseFloat(document.getElementById("lots").value);
  const open = parseFloat(document.getElementById("open").value);
  const close = parseFloat(document.getElementById("close").value);
  const commissionRate = parseFloat(document.getElementById("commission").value);
  const swapRate = parseFloat(document.getElementById("swap").value);
  const days = parseInt(document.getElementById("days").value);

  if(isNaN(open) || isNaN(close)) return;

  const cs = contractSize();

  /* Gross P/L */
  const grossPL = (close - open) * cs * lots;

  /* Commission */
  let commissionCost = 0;
  if(commissionRate > 0){
    if(isCrypto(symbol)){
      commissionCost = close * cs * lots * (commissionRate / 100);
    } else {
      commissionCost = close * cs * lots * commissionRate;
    }
  }

  /* Swap */
  const swapCost = swapRate * lots * days;

  /* Net */
  const netPL = grossPL - commissionCost - swapCost;

  document.getElementById("output").innerHTML =
    "Gross P/L: $" + grossPL.toFixed(2) + "<br>" +
    "Commission: $" + commissionCost.toFixed(2) + "<br>" +
    "Swap: $" + swapCost.toFixed(2) + "<br>" +
    "————————————<br>" +
    "NET RESULT: $" + netPL.toFixed(2);
}

/* Live updates */
document.querySelectorAll("input").forEach(el=>{
  el.addEventListener("input", update);
});
</script>

</body>
</html>
