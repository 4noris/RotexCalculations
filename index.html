<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rotex Formula Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:16px;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
h1{
  text-align:center;
  margin-bottom:18px;
  background:linear-gradient(90deg,#5A378A,#EE7448);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.box{
  max-width:560px;
  margin:14px auto;
  padding:14px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:14px;
}
.box h3{
  margin:0 0 8px;
}
label{
  display:block;
  margin-top:8px;
  font-size:13px;
  opacity:.85;
}
input,select,button{
  width:100%;
  margin-top:5px;
  padding:8px;
  background:#111;
  color:#fff;
  border:1px solid rgba(255,255,255,0.3);
  border-radius:6px;
}
button{
  margin-top:10px;
  cursor:pointer;
  background:#1c1c1c;
  font-weight:600;
}
.result{
  margin-top:10px;
  padding:10px;
  background:#111;
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.3);
  font-weight:600;
}
.small{
  font-size:12px;
  color:#aaa;
  margin-top:6px;
}
</style>
</head>

<body>

<h1>ROTEX FORMULA CALCULATOR</h1>

<!-- NOTIONAL VALUE -->
<div class="box">
<h3>Notional Value (USD)</h3>
<label>Price</label><input id="nv_price">
<label>Lot Size</label><input id="nv_lots" value="1">
<label>Contract Size</label><input id="nv_contract" value="100000">
<label>Conversion Rate</label><input id="nv_conv" value="1">
<button onclick="calcNotional()">Calculate</button>
<div class="result" id="nv_res">-</div>
</div>

<!-- LEVERAGE -->
<div class="box">
<h3>Leverage</h3>
<label>Market Price</label><input id="lev_price">
<label>Lot Size</label><input id="lev_lots" value="1">
<label>Contract Size</label><input id="lev_contract" value="100000">
<label>Blocked Margin</label><input id="lev_margin">
<button onclick="calcLeverage()">Calculate</button>
<div class="result" id="lev_res">-</div>
</div>

<!-- POINT VALUE PER LOT -->
<div class="box">
<h3>Point Value per Lot</h3>
<label>Digits</label><input id="pvl_digits" value="5">
<label>Contract Size</label><input id="pvl_contract" value="100000">
<label>Conversion Rate</label><input id="pvl_conv" value="1">
<button onclick="calcPVLot()">Calculate</button>
<div class="result" id="pvl_res">-</div>
</div>

<!-- POINT VALUE -->
<div class="box">
<h3>Point Value</h3>
<label>Digits</label><input id="pv_digits" value="5">
<label>Lot Size</label><input id="pv_lots" value="1">
<label>Contract Size</label><input id="pv_contract" value="100000">
<label>Conversion Rate</label><input id="pv_conv" value="1">
<button onclick="calcPV()">Calculate</button>
<div class="result" id="pv_res">-</div>
</div>

<!-- COMMISSION PER MILLION -->
<div class="box">
<h3>Commission per Million</h3>
<label>Notional Value (USD)</label><input id="cpm_notional">
<label>Amount per Million</label><input id="cpm_amt">
<button onclick="calcCPM()">Calculate</button>
<div class="result" id="cpm_res">-</div>
</div>

<!-- SWAP -->
<div class="box">
<h3>Swap</h3>
<label>Digits</label><input id="sw_digits" value="5">
<label>Contract Size</label><input id="sw_contract" value="100000">
<label>Lot Size</label><input id="sw_lots" value="1">
<label>Swap Rate</label><input id="sw_rate">
<label>Days</label><input id="sw_days" value="1">
<button onclick="calcSwap()">Calculate</button>
<div class="result" id="sw_res">-</div>
</div>

<!-- COMMISSION -->
<div class="box">
<h3>Commission</h3>
<label>Close Price</label><input id="com_price">
<label>Contract Size</label><input id="com_contract" value="1">
<label>Lot Size</label><input id="com_lots" value="1">
<label>Commission Rate (Forex = decimal | Crypto = %)</label><input id="com_rate">
<label>Instrument</label>
<select id="com_type">
  <option value="forex">Forex</option>
  <option value="crypto">Crypto</option>
</select>
<button onclick="calcCommission()">Calculate</button>
<div class="result" id="com_res">-</div>
</div>

<div class="box small">
Important Note:<br>
• Multiply if USD is Quote (e.g. NZDUSD)<br>
• Divide if USD is Base (e.g. USDJPY)
</div>

<script>
function point(d){ return Math.pow(10,-d); }

function calcNotional(){
  nv_res.innerText =
    (nv_price.value * nv_lots.value * nv_contract.value * nv_conv.value).toFixed(2);
}

function calcLeverage(){
  lev_res.innerText =
    (lev_price.value * lev_lots.value * lev_contract.value / lev_margin.value).toFixed(2);
}

function calcPVLot(){
  pvl_res.innerText =
    (point(pvl_digits.value) * pvl_contract.value * pvl_conv.value).toFixed(5);
}

function calcPV(){
  pv_res.innerText =
    (point(pv_digits.value) * pv_lots.value * pv_contract.value * pv_conv.value).toFixed(5);
}

function calcCPM(){
  cpm_res.innerText =
    (cpm_notional.value * (cpm_amt.value / 1000000)).toFixed(2);
}

function calcSwap(){
  sw_res.innerText =
    (point(sw_digits.value) * sw_contract.value * sw_lots.value * sw_rate.value * sw_days.value).toFixed(5);
}

function calcCommission(){
  let rate = com_rate.value;
  if(com_type.value === "crypto") rate /= 100;
  com_res.innerText =
    (com_price.value * com_contract.value * com_lots.value * rate).toFixed(2);
}
</script>

</body>
</html>
