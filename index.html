<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rotex Forex Calculator</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:black;
  color:#fff;
  padding:18px;
}
header h1{
  text-align:center;
  margin-bottom:16px;
  font-size:2em;
  background: linear-gradient(90deg, #5A378A 0%, #EE7448 92.4%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.container{
  display:flex;
  gap:30px;
  flex-wrap:wrap;
  justify-content: space-evenly;
}
.formulaBox{
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  width:420px;
  min-width:300px;
  border:1px solid rgba(255,255,255,0.2);
  border-radius:12px;
  padding:14px;
}
.formulaBox h3{
  margin-bottom:8px;
  background: linear-gradient(90deg, #5A378A 0%, #EE7448 92.4%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
label{display:block;margin-top:8px;font-size:13px}
input,select{
  margin-top:6px;
  padding:8px;
  width:100%;
  border-radius:6px;
  border:1px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.05);
  color:#fff;
}
.result{
  margin-top:12px;
  padding:8px;
  background: rgba(255,255,255,0.08);
  border-radius:6px;
}
.small{font-size:12px;color:#aaa;margin-top:6px}
footer p{text-align:center;color:gray;margin-top:30px}
</style>
</head>

<body>
<header><h1>ROTEX FOREX CALCULATOR</h1></header>

<div class="container">

<!-- Pip Difference -->
<div class="formulaBox">
<h3>Pip Difference</h3>
<label>Pair</label>
<input id="pipPair" value="EURUSD">
<label>Open Price</label>
<input id="pipOpen" type="number" step="0.00001">
<label>Close Price</label>
<input id="pipClose" type="number" step="0.00001">
<div class="result" id="pipDiffResult">-</div>
</div>

<!-- Margin -->
<div class="formulaBox">
<h3>Margin Calculator</h3>
<label>Pair</label>
<input id="pair" value="AUDCAD">
<label>Lot Type</label>
<select id="lotType">
<option value="standard">Standard</option>
<option value="mini">Mini</option>
<option value="micro">Micro</option>
</select>
<label>Lots</label>
<input id="lots" type="number" value="1">
<label>Price</label>
<input id="price" type="number" step="0.00001">
<label>Leverage (1:100 → 100)</label>
<input id="leverage" type="number" value="100">
<label>USD/QUOTE Rate (if non-USD)</label>
<input id="crossRate" type="number" step="0.00001">
<label>Equity (USD)</label>
<input id="equity" type="number" value="1000">
<div class="result" id="marginUSDResult">-</div>
<div class="result" id="blockedResult">-</div>
<div class="result" id="marginLevelResult">-</div>
</div>

<!-- Pip Value -->
<div class="formulaBox">
<h3>Pip Value & Spread</h3>
<label>Pair</label>
<input id="pvPair" value="AUDCAD">
<label>Lot Type</label>
<select id="pvLot">
<option value="standard">Standard</option>
<option value="mini">Mini</option>
<option value="micro">Micro</option>
</select>
<label>Price</label>
<input id="pvPrice" type="number" step="0.00001">
<label>USD/QUOTE Rate</label>
<input id="pvCross" type="number" step="0.00001">
<label>Spread (pips)</label>
<input id="pvSpread" type="number" step="0.01">
<label>Lots</label>
<input id="pvSpreadLots" type="number" value="1">
<div class="result" id="pipValueResult">-</div>
<div class="result" id="spreadCostResult">-</div>
</div>

<!-- Profit / Loss -->
<div class="formulaBox">
<h3>Profit / Loss</h3>
<label>Pair</label>
<input id="plPair" value="AUDCAD">
<label>Lot Type</label>
<select id="plLotType">
<option value="standard">Standard</option>
<option value="mini">Mini</option>
<option value="micro">Micro</option>
</select>
<label>Lots</label>
<input id="plLots" type="number" value="1">
<label>Open Price</label>
<input id="plOpen" type="number" step="0.00001">
<label>Close Price</label>
<input id="plClose" type="number" step="0.00001">
<label>Type</label>
<select id="plType">
<option value="buy">Buy</option>
<option value="sell">Sell</option>
</select>
<label>USD/QUOTE Rate</label>
<input id="plCross" type="number" step="0.00001">
<div class="result" id="plResult">-</div>
</div>

</div>

<footer><p>Built by 4noris</p></footer>

<script>
function getPipSize(pair){
  return pair.endsWith("JPY") ? 0.01 : 0.0001;
}
function contractSize(lot){
  if(lot==="standard") return 100000;
  if(lot==="mini") return 10000;
  if(lot==="micro") return 1000;
}

function calcPipDiff(){
  const open=+pipOpen.value, close=+pipClose.value;
  if(!open||!close) return;
  const pip=getPipSize(pipPair.value.toUpperCase());
  pipDiffResult.innerText=
    `Pips: ${((close-open)/pip).toFixed(2)}`;
}

function calculateMargin(){
  const pairV=pair.value.toUpperCase();
  const base=pairV.slice(0,3), quote=pairV.slice(3);
  const lotsV=+lots.value, priceV=+price.value;
  const lev=+leverage.value, cross=+crossRate.value;
  const equityV=+equity.value;
  if(!priceV||!lotsV||!lev) return;

  const contract=contractSize(lotType.value);
  let margin;
  if(quote==="USD") margin=(contract*lotsV*priceV)/lev;
  else if(base==="USD") margin=(contract*lotsV)/lev;
  else{
    if(!cross) return;
    margin=(contract*lotsV*priceV)/(lev*cross);
  }

  marginUSDResult.innerText=`Margin USD: $${margin.toFixed(2)}`;
  blockedResult.innerText=`Blocked: $${margin.toFixed(2)}`;
  marginLevelResult.innerText=
    `Margin Level: ${((equityV/margin)*100).toFixed(2)}%`;
}

function calculatePip(){
  const pairV=pvPair.value.toUpperCase();
  const pip=getPipSize(pairV);
  const contract=contractSize(pvLot.value);
  const priceV=+pvPrice.value, cross=+pvCross.value;
  const spread=+pvSpread.value, lotsV=+pvSpreadLots.value||1;
  const base=pairV.slice(0,3), quote=pairV.slice(3);

  let pipUSD;
  if(quote==="USD") pipUSD=contract*pip;
  else if(base==="USD") pipUSD=(contract*pip)/priceV;
  else{
    if(!cross) return;
    pipUSD=(contract*pip)/cross;
  }

  pipValueResult.innerText=`Pip Value: $${pipUSD.toFixed(5)}`;
  if(spread)
    spreadCostResult.innerText=
      `Spread Cost: $${(pipUSD*spread*lotsV).toFixed(2)}`;
}

function calculatePL(){
  const pairV=plPair.value.toUpperCase();
  const open=+plOpen.value, close=+plClose.value;
  if(!open||!close) return;
  const lotsV=+plLots.value;
  const contract=contractSize(plLotType.value);
  const base=pairV.slice(0,3), quote=pairV.slice(3);
  let raw=(close-open)*contract*lotsV;
  if(plType.value==="sell") raw*=-1;

  let usd;
  if(quote==="USD") usd=raw;
  else if(base==="USD") usd=raw/close;
  else{
    const cross=+plCross.value;
    if(!cross) return;
    usd=raw/cross;
  }
  plResult.innerText=`P/L: $${usd.toFixed(2)}`;
}

document.querySelectorAll("input,select")
.forEach(e=>e.addEventListener("input",()=>{
  calcPipDiff();
  calculateMargin();
  calculatePip();
  calculatePL();
}));
</script>

</body>
</html>
